name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore tests/IntegrationTests/IntegrationTests.csproj
      - run: dotnet build tests/IntegrationTests/IntegrationTests.csproj --no-restore -c Release
      - run: dotnet test tests/IntegrationTests/IntegrationTests.csproj --no-build -c Release

  webapp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Src/Presentation/Webapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Src/Presentation/Webapp/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
